## Render.com — Sphera Radio AI Deploy Config
## Servislar: postgres (managed DB), redis (managed), backend (web), bot (worker)

databases:
  - name: sphera-postgres
    databaseName: radio_db
    user: sphera
    plan: free

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: sphera-redis
    plan: free
    ipAllowList: []

  # ── Backend (FastAPI + Frontend SPA + Icecast) ─────────────────────────────
  - type: web
    name: sphera-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sphera-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sphera-redis
          property: connectionString
      - key: USE_ICECAST
        value: "true"
      - key: USE_MEDIAMTX
        value: "false"
      - key: AUDIO_DIR
        value: "/tmp/sphera_audio"
      - key: UPLOAD_DIR
        value: "/tmp/sphera_uploads"
      - key: MINIAPP_DIR
        value: "/app/static"
      - key: DISABLE_GROUP_CHECK
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: TTS_PROVIDER
        value: "edge"
      - key: TTS_FALLBACK_EDGE
        value: "true"
      # ↓ Render Dashboard → sphera-backend → Environment da qo'shing ↓
      - key: SECRET_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ICECAST_PASS
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  # ── Telegram Bot (background worker) ──────────────────────────────────────
  - type: worker
    name: sphera-bot
    runtime: docker
    dockerfilePath: bot/Dockerfile
    dockerContext: bot
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # MINI_APP_URL = backend URL (Render deploy qilgach ma'lum bo'ladi)
      - key: MINI_APP_URL
        sync: false
      # INTERNAL_API_URL = backend Render internal URL
      # Format: https://sphera-backend.onrender.com
      - key: INTERNAL_API_URL
        sync: false
